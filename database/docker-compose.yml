services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-campus-postgres
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-campus

  postgrest:
    image: postgrest/postgrest:v12.0.0
    container_name: smart-campus-postgrest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://smartcampus:smartcampus@postgres:5432/smartcampus
      PGRST_DB_SCHEMAS: app,public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: dxos-super-secret-jwt-key-2026-olp-vfoss
    ports:
      - "3002:3000"
    networks:
      - smart-campus

volumes:
  postgres_data:

networks:
  smart-campus:
    driver: bridge
