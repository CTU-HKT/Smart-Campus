services:
  postgres:
    image: postgres:18-alpine
    container_name: smart-campus-postgres
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smart-campus

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: smart-campus-keycloak
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: 1234

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Admin123!

      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/dxos-realm.json:/opt/keycloak/data/import/dxos-realm.json
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    networks:
      - smart-campus

  etcd:
    image: bitnamilegacy/etcd:3.5.11
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - smart-campus

  apisix:
    image: apache/apisix:3.13.0-debian
    depends_on:
      - etcd
    volumes:
      # Náº¡p cáº¥u hÃ¬nh Standalone
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./apisix_conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml
    ports:
        - "9080:9080"
    networks:
      - smart-campus

  postgrest:
    image: postgrest/postgrest
    container_name: smart-campus-postgrest
    depends_on:
      - postgres
    environment:
      # DÃ¹ng user authenticator (Ä‘Ã£ táº¡o trong init.sql)
      PGRST_DB_URI: postgres://authenticator:secretpassword@postgres:5432/smartcampus
      PGRST_DB_SCHEMAS: public
      # DÃ¹ng role web_anon (Ä‘Ã£ táº¡o trong init.sql)
      PGRST_DB_ANON_ROLE: web_anon
      # Cá»¥c JWKS láº¥y tá»« Keycloak Ä‘á»ƒ verify token
      PGRST_JWT_SECRET: '{"keys":[{"kid":"fkn8y9rvrsE2DpuV3zKXI1GNrwS27jzzMuWp3aCL2LE","kty":"RSA","alg":"RSA-OAEP","use":"enc","x5c":[""],"x5t":"JSsMUA69gsXEsRxEkHAuDjeoJvg","x5t#S256":"cOioMva3Q8vIvc8kGY0_tLW83rZresnCZ98Z839nAP0","n":"qrLjaBSFWS2DQKWv94IAERtBeERQfyAb3T0RSIlFToe_fOomShJ3pstoiX0lyb8H1OV6CGNfAMR8yXm8sQMg-YXI0qsyC6bvm3wBGhzmqhHUvexeJnD1NaOAONkDjzFW0EsRpGoNe7fb_hKS7arm1lVJ-eRSPRfBP3gr_AevmYgYVnsjuDPkB7xqKaQPeFMuXBPTQkrczQCaXSMYpuKZ7Yjn-IkIQWf-udEHJQJ_gHyqdEb7Ft9wvFixnBSBRp1KJnIrrjA3j5o9gnuNNhIYlEY-klp_nZsbWKLjIcXfNPUmVOekanam684WMXvwDYz58Thtr2QMlbbVLPikwXwk2w","e":"AQAB"},{"kid":"LwMTyEAHRgPViey5e3SfOi3_Tbs8AFK5NGOI4BRPIsY","kty":"RSA","alg":"RS256","use":"sig","x5c":[""],"x5t":"Mhdb6eyDXYLQnka5qCeqPC0KiqE","x5t#S256":"81aOXKrB3tEpsmGWKS10ytcaDnbMBJtO5l8u-sBDnvk","n":"0NoWa_KwFFxi6lKZmSwi2CnCuSS1FEDsg0tPg27eltc3YdDWCl8PO1Kp7zsxBfxgIydkpQwVTKVYJ12Fp5MKOxiFpCPdniKS5JdOPOyGRVQJXeBzor2i23fuxj4fjd6Na0FVm0JON5G2Cq6oS5SOF6IYYaUb7PPZ_7MsbkhgK5XBJmBv0dtck4_EEU1UXBvlzQSXSe7Uv04F2cAAXmAgJkhRBJTz4ioLOwTjsj2gWcTtGTetPG4YqFrPZhwwOYc_lvdZnUSRg3WKoYB7WeGmsgJGJgt7YqZinbZaTqOpyNbXuRgfuGSRHbG8iqtF5eU9xC2xUATcInrM75841TJSTQ","e":"AQAB"}]}'
    ports:
      - "3000:3000"
    networks:
      - smart-campus

  student-portal:
    build:
      context: ./student-portal
    container_name: smart-campus-student-portal
    ports:
      - "3001:3000"
    networks:
      - smart-campus

  flowable:
    image: flowable/flowable-rest:6.8.0
    container_name: smart-campus-flowable
    depends_on:
      - postgres
    environment:
      SERVER_PORT: 8081
      #Cáº¥u hÃ¬nh káº¿t ná»‘i flowable vá»›i postgreSQL
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/flowable"
      #TÃ i khoáº£n Ä‘á»ƒ cÃ³ thá»ƒ dÃ¹ng postgreSQL. Vá»›i Ä‘iá»u kiá»‡n postgreSQL Ä‘Ã£ táº¡o vÃ¹ng dá»¯ liá»‡u vá»›i tÃ i khoáº£n vÃ  máº­t kháº©u nhÆ° nÃ y
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: flowable
      #TÃ i khoáº£n Ä‘á»ƒ cáº¥u hÃ¬nh Ä‘Æ°á»£c flowable
      FLOWABLE_REST_APP_ADMIN_USER_ID: admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"
    networks:
      - smart-campus

  flyway:
    image: flyway/flyway:11
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/smartcampus
      FLYWAY_USER: smartcampus
      FLYWAY_PASSWORD: smartcampus
      FLYWAY_SCHEMAS: public
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CONNECT_RETRIES: "30"

    volumes:
      - ./database/migrations:/flyway/sql:ro

    command: migrate

    networks:
      - smart-campus

  signing-service:
    build:
      context: ./signing-service
      dockerfile: Dockerfile

    container_name: smart-campus-signing

    restart: unless-stopped

    environment:
      SOFTHSM2_CONF: /app/softhsm2.conf
      SOFTHSM_TOKEN_LABEL: smartcampus-demo
      SOFTHSM_KEY_LABEL: smartcampus-signer
      SOFTHSM_USER_PIN: ${SOFTHSM_USER_PIN:?Set SOFTHSM_USER_PIN}
      SOFTHSM_SO_PIN: ${SOFTHSM_SO_PIN:?Set SOFTHSM_SO_PIN}
      IMMUDB_HOST: immudb
      IMMUDB_PORT: "3322"
      IMMUDB_USERNAME: ${IMMUDB_USERNAME:-immudb}
      IMMUDB_PASSWORD: ${IMMUDB_PASSWORD:?Set IMMUDB_PASSWORD}
      SIGNING_DB_HOST: ${SIGNING_DB_HOST:-postgres}
      SIGNING_DB_PORT: ${SIGNING_DB_PORT:-5432}
      SIGNING_DB_NAME: ${SIGNING_DB_NAME:-smartcampus}
      SIGNING_DB_USER: ${SIGNING_DB_USER:-signing_service}
      SIGNING_DB_PASSWORD: ${SIGNING_DB_PASSWORD:?Set SIGNING_DB_PASSWORD}
      SIGNING_INTERNAL_API_KEY: ${SIGNING_INTERNAL_API_KEY:?set-in-env}
      SIGNING_INTERNAL_URL: http://127.0.0.1:8000
      SIGNING_CERT_PATH: /app/certs/signer.crt
      SIGNED_PDF_DIR: /app/storage
    volumes:
      - softhsm_data:/var/lib/softhsm/tokens
      - ./signing-service/certs:/app/certs
      - ledger_trust_state:/var/lib/signing-ledger
      - signed_pdf_data:/app/storage
      - signed_pdf_data:/app/storage

    ports:
      - "127.0.0.1:8001:8000"

    networks:
      - smart-campus

  immudb:
    image: codenotary/immudb:1.9.5
    container_name: smart-campus-immudb
    restart: unless-stopped

    volumes:
      - immudb_data:/var/lib/immudb

    networks:
      - smart-campus
volumes:
  postgres_data:
  etcd_data:
  softhsm_data:
  immudb_data:
  ledger_trust_state:
  signed_pdf_data:
networks:
  smart-campus:
    driver: bridge

