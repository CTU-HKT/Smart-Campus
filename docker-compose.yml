services:
  postgres:
    image: postgres:18-alpine
    container_name: smart-campus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smart-campus

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: smart-campus-keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/dxos-realm.json:/opt/keycloak/data/import/dxos-realm.json
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    networks:
      - smart-campus

  etcd:
    image: bitnamilegacy/etcd:3.5.11
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - smart-campus

  apisix:
    image: apache/apisix:3.13.0-debian
    depends_on:
      - etcd
    environment:
      FLOWABLE_ADMIN_USER_ID: ${FLOWABLE_ADMIN_USER_ID}
      FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./apisix_conf/apisix.yaml.tmpl:/apisix-template/apisix.yaml.tmpl:ro
    # Render apisix.yaml từ template: thay placeholder bằng Basic auth của Flowable (từ .env), rồi chạy APISIX như bình thường.
    entrypoint:
      - /bin/sh
      - -c
      - |
        : "$${FLOWABLE_ADMIN_USER_ID:?FLOWABLE_ADMIN_USER_ID chưa được đặt trong .env}"
        : "$${FLOWABLE_ADMIN_PASSWORD:?FLOWABLE_ADMIN_PASSWORD chưa được đặt trong .env}"
        B64=$$(printf '%s:%s' "$$FLOWABLE_ADMIN_USER_ID" "$$FLOWABLE_ADMIN_PASSWORD" | base64 | tr -d '\n')
        sed "s|__FLOWABLE_BASIC_B64__|$$B64|" /apisix-template/apisix.yaml.tmpl > /usr/local/apisix/conf/apisix.yaml
        exec /docker-entrypoint.sh docker-start
    ports:
        - "9080:9080"
    networks:
      - smart-campus

  postgrest:
    image: postgrest/postgrest
    container_name: smart-campus-postgrest
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: app,public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
    ports:
      - "3000:3000"
    networks:
      - smart-campus

  student-portal:
    build:
      context: ./student-portal
    container_name: smart-campus-student-portal
    ports:
      - "3001:3000"
    networks:
      - smart-campus

  flowable:
    image: flowable/flowable-rest:6.8.0
    container_name: smart-campus-flowable
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/flowable"
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD}
      FLOWABLE_REST_APP_ADMIN_USER_ID: ${FLOWABLE_ADMIN_USER_ID}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
    # XOÁ CỔNG 8081 ĐỂ BẢO MẬT (Chỉ giao tiếp qua APISIX)
    networks:
      - smart-campus

  flyway:
    image: flyway/flyway:11
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_SCHEMAS: public
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_BASELINE_ON_MIGRATE: "true" 
      FLYWAY_BASELINE_VERSION: "0" 
      FLYWAY_CONNECT_RETRIES: "30"
    volumes:
      - ./database/migrations:/flyway/sql:ro
    command: migrate
    networks:
      - smart-campus

  flowable-init:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      - flowable
    volumes:
      - ./flowableworkflow/NopHoSoDiemI1.bpmn20.xml:/tmp/NopHoSoDiemI1.bpmn20.xml:ro
    command: >
      sh -c "
        echo 'Waiting for Flowable engine...'
        while ! curl -s -u ${FLOWABLE_ADMIN_USER_ID}:${FLOWABLE_ADMIN_PASSWORD} http://flowable:8081/flowable-rest/service/repository/process-definitions > /dev/null; do
          sleep 2
        done
        if ! curl -s -u ${FLOWABLE_ADMIN_USER_ID}:${FLOWABLE_ADMIN_PASSWORD} 'http://flowable:8081/flowable-rest/service/repository/process-definitions?key=quyTrinhDuyetDiemI_CNTT' | grep -q 'quyTrinhDuyetDiemI_CNTT'; then
          echo 'Deploying BPMN to Flowable...'
          curl -s -u ${FLOWABLE_ADMIN_USER_ID}:${FLOWABLE_ADMIN_PASSWORD} -X POST http://flowable:8081/flowable-rest/service/repository/deployments -F 'file=@/tmp/NopHoSoDiemI1.bpmn20.xml'
          echo 'Deploy complete!'
        else
          echo 'BPMN already deployed.'
        fi
      "
    networks:
      - smart-campus

volumes:
  postgres_data:
  etcd_data:

networks:
  smart-campus:
    driver: bridge